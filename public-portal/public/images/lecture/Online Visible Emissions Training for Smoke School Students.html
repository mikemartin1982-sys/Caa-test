<script>

var slideIndex = 1;
var temp_slides = document.getElementsByClassName("mySlides");
if (temp_slides && temp_slides.length)
    showSlides(slideIndex);

// Next/previous controls
function plusSlides(n) {
    showSlides(slideIndex += n);
}

// Thumbnail image controls
function currentSlide(n) {
    showSlides(slideIndex = n);
}

function showSlides(n)
{
    var i;
    var slides = document.getElementsByClassName("mySlides");
    var dots = document.getElementsByClassName("demo");
    var captionText = document.getElementById("caption");
    if (n > slides.length) {slideIndex = 1}
    if (n < 1) {slideIndex = slides.length}
    for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }
    for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
    }
    slides[slideIndex-1].style.display = "block";
    dots[slideIndex-1].className += " active";
    captionText.innerHTML = dots[slideIndex-1].alt;
}

function scroll_to_element(ele)
{
    var offsetTop = ele.offsetTop;
    document.documentElement.scrollTo({
        top: offsetTop,
        left: document.documentElement.scrollLeft,
        behavior: 'smooth'
    });
}


function onload_after_delay()
{
    var this_url = location.href;
    var anchor_index = this_url.indexOf("#");
    if (anchor_index !== -1)                    // if the url has an anchor reference in it
    {
        var urlParts = this_url.split('#');
        anchor_name = (urlParts.length > 1) ? urlParts[1] : null;
        if (anchor_name)                        // if the the url has a n anchor name
        {                                       // see if we can find that name in an element on this webpage
            var eles = document.getElementsByName(anchor_name);
            if (eles && eles.length)                               // if found at least one element with that name
            {                                       // scroll to the first element
                var ele = eles[0];
                scroll_to_element(ele);
            }//
            else                                    // else name Not found on webpage
            {                                       // so check for id
                var ele = document.getElementById(anchor_name);
                if (ele)                                // if found element with that id
                {                                       // scroll to that element
                    scroll_to_element(ele);
                }//
            }
        }
    }
}

function force_redraw(element)
{

function walkDOM_highlight_search_str(node,search_str)     // walk the DOM down from node
{
    var should_check_text = true;
    if ( (typeof node.parentNode.className !== 'undefined')                 // if the node's parent has a class
        && (node.parentNode.className.indexOf('search_result') !== -1) )    // and one of the classes tells use that this node already contains a search-result
        should_check_text = false;
    if (   (should_check_text)                                              // if we should check the text
        && (node.nodeType === Node.TEXT_NODE) )                             // and this node has text
    {                                                                       // then see if that text contains the search_str
        var text_str = node.nodeValue;
        var search_str_escaped = search_str.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');      // escape the search_str becaus eit might contain regex special characters, like '?'
        var my_regex = new RegExp(`(${search_str_escaped})`, 'ig');                         // capture group in a case-insensitive global regex
        var highlighted_text_str = text_str.replace(my_regex, "<span class='search_result' style='display:inline; color:black; background-color:#ffb050; font-weight:bold;'>$1</span>");   // replace the search-str with a span surrounding it, highlighting in light-orange
        if (text_str !== highlighted_text_str)      // if we found the search_str and wrapped it in a span
        {                                           // then prepend this new span to the node
            node.nodeValue = "";                        // get rid of the textNode that we are replacing with a new span
            var htmlNode = document.createElement('span');
            htmlNode.innerHTML = highlighted_text_str;
            node.parentNode.appendChild(htmlNode);
        }
    }
    node = node.firstChild;
    while(node)
    {
        walkDOM_highlight_search_str(node,search_str);
        node = node.nextSibling;
    }
}

function smooth_scroll(direction, amount_remaining)
{
    if (direction === "UP")
        flex_container2.scrollTop -= 5;
    else
        flex_container2.scrollTop += 5;
    amount_remaining -= 5;
    if (amount_remaining > 0)                                           // if there is more to scroll
        setTimeout(smooth_scroll, 30, direction, amount_remaining);    // delay 30ms before scrolling the next increment
}

// fix for chrome not handling mouse-wheel correctly in some elements
if (!!window.chrome && (!!window.chrome.webstore || !!window.chrome.runtime))       // if chrome browser
{
    var flex_container2 = document.getElementById("content");
    if (flex_container2)      // if the flex_container2 exist on this webpage
    {
        flex_container2.addEventListener(
            "wheel",
            function handleWheelEvent(event) {
                event.preventDefault();
            // get the wheel direction in order to help us figure out whether to let the default event happen
                var delta = (event.deltaY || event.detail);
                var direction = ((delta <= 0) ? "UP" : "DOWN");
            // determine if the given element is scrolled to the maximum offset in the
                var isScrolledInMaxDirection = false;
                if ( direction === "UP" )
                    isScrolledInMaxDirection = (! flex_container2.scrollTop);
                else
                    isScrolledInMaxDirection = ( ( flex_container2.clientHeight + flex_container2.scrollTop ) >= flex_container2.scrollHeight );
            // determine if we need to scroll
                if (!isScrolledInMaxDirection)  // if the wheel is Not scrolling past either end
                {                                                           // then scroll the container an incremental amount
                    smooth_scroll(direction, 80);
                }
            },
            false
        );
    }
}//
