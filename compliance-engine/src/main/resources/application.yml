spring:
  application:
    name: compliance-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/caa_platform
    username: postgres
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      # Schema is owned by the SQL migrations in db/migrations -- Hibernate
      # should validate against it, never auto-generate/alter in any real
      # environment. 'validate' will fail fast if the entities drift from
      # the actual migrated schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Chicago  # Central Time display convention, Section 4c
  mail:
    # Defaults target MailHog (a free, zero-signup local fake-SMTP tool --
    # https://github.com/mailhog/MailHog -- catches emails in a web UI at
    # http://localhost:8025 without ever sending anything real). Swap
    # these for real SMTP credentials (e.g. via env vars, same pattern as
    # DB_PASSWORD) once actual email sending is needed.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: 8080

app:
  # Michael, 2026-08-31 -- Password Reset feature. Where a reset email's
  # link points back to -- Laravel, not this Java API itself, since
  # that's where the actual reset-password page/form lives. Defaults to
  # this project's own, already-established local dev port (confirmed
  # throughout tonight's work, e.g. http://127.0.0.1:8000/admin/...).
  frontend-base-url: ${FRONTEND_BASE_URL:http://127.0.0.1:8000}
  certificates:
    # Section 4g: where generated certification PDFs are written. Relative
    # path resolves against wherever the JVM process's working directory
    # is when started (e.g. compliance-engine/ if launched via
    # mvnw.cmd spring-boot:run from that folder) -- point this at an
    # absolute path for anything beyond local dev.
    output-dir: ./certificates
  mail:
    from: ${MAIL_FROM:no-reply@compliance-assurance.com}
  brevo:
    # Section 2/3: one-directional Client -> Brevo contact sync. Get your
    # API key from Brevo: Settings -> SMTP & API -> API Keys.
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com/v3}
    # Michael, 2026-09-01 -- Client Auto-Notify feature. Must be a real
    # address Brevo itself has verified (Single Sender Verification or
    # full domain authentication) -- confirmed as its own, separate
    # setting from app.mail.from, which Brevo never sees or verifies.
    sender-email: ${BREVO_SENDER_EMAIL:}
    sender-name: ${BREVO_SENDER_NAME:Compliance Assurance Associates, Inc.}
    # Michael, 2026-09-02 -- Client Auto-Notify feature. The real,
    # Michael-designed template ID (Transactional > Templates, built
    # directly in Brevo's own editor) for the Public-session enrollment
    # notification -- externalized, not hardcoded, so a future template
    # revision only ever needs a config change, not a code change.
    enrollment-notification-template-id: ${BREVO_ENROLLMENT_NOTIFICATION_TEMPLATE_ID:425}
    # Michael, 2026-09-03 -- Client Auto-Notify feature, LECTURE_ONLY
    # path. A genuinely separate template from the Field one (above) --
    # confirmed with Michael as needing different content entirely (no
    # location/time, just the real, existing self-paced lecture access
    # URL and Student ID). Shared by BOTH QboPaymentNotificationService
    # (Public) and PrivateEnrollmentNotificationService (Private/Semi-
    # Private) -- template choice is driven by component (Field vs.
    # Lecture), independent of the timing split each service already
    # handles on its own.
    lecture-notification-template-id: ${BREVO_LECTURE_NOTIFICATION_TEMPLATE_ID:426}
    # Michael, 2026-09-02 -- Client Auto-Notify feature, Private/Semi-
    # Private path. Originally its own, separate config key here --
    # removed once Michael confirmed, after actually building the real
    # template, that the SAME one (above) genuinely works for both
    # Public and Private/Semi-Private -- PrivateEnrollmentNotificationService
    # now reuses enrollment-notification-template-id directly, not a
    # second, parallel setting.
  qbo:
    # Michael, 2026-08-25 -- QuickBooks Online integration. The actual
    # OAuth redirect/consent dance happens on the Laravel side (that's
    # where all browser-facing routes live in this project) -- this
    # side receives the resulting tokens and stores them (encrypted --
    # see QboTokenEncryptionConverter), and will later use these same
    # client credentials to refresh an expired access token (1-hour
    # lifespan) without a person needing to re-consent every time.
    client-id: ${QBO_CLIENT_ID:}
    client-secret: ${QBO_CLIENT_SECRET:}
    # 32-byte (256-bit) key for AES-GCM encryption of stored tokens,
    # base64-encoded. Generate one via: openssl rand -base64 32
    token-encryption-key: ${QBO_TOKEN_ENCRYPTION_KEY:}
    environment: ${QBO_ENVIRONMENT:SANDBOX}

logging:
  level:
    com.caa.platform: INFO
